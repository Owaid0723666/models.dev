# Effort: reasoning_effort = none|high. onomeo's main route for this model
# accepts none|low|medium|high|xhigh (its error text lists them) and rejects
# max, but a live test on 2026-09-29 showed no grading between low, medium,
# high and xhigh; none turns reasoning off. Aligned to the lab-effective level
# (DeepSeek maps low/medium to high). No separate toggle on this route.
base_model = "deepseek/deepseek-v4-flash"
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0
output = 0
