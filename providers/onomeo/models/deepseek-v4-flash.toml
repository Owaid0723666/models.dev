# Effort: reasoning_effort = none|low|medium|high|xhigh. onomeo's main route for
# this model answers an unknown value with "should be one of: low, medium, high,
# xhigh, none" (tested 2026-09-29); none turns thinking off, which onomeo's own
# thinking check also records. No separate toggle, since effort includes none.
base_model = "deepseek/deepseek-v4-flash"
reasoning_options = [{ type = "effort", values = ["none", "low", "medium", "high", "xhigh"] }]

[cost]
input = 0
output = 0
